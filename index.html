<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0a">
<title>ARCHITECTURE — Immersive Gallery</title>
<link rel="shortcut icon" href="TemplateData/favicon.ico">
<style>
:root{--ink:#f4f1e9;--muted:rgba(244,241,233,.58);--line:rgba(244,241,233,.22);--glass:rgba(13,13,12,.48);--accent:#d6c39b}
*{box-sizing:border-box} html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0b0b0a;color:var(--ink);font-family:Inter,"Helvetica Neue",Arial,sans-serif}
body{letter-spacing:.01em} button{font:inherit;color:inherit}
#stage,#unity-container,#unity-canvas{position:absolute;inset:0;width:100%;height:100%}#unity-canvas{display:block;background:#0b0b0a;outline:none}
#veil{position:fixed;inset:0;z-index:30;background:radial-gradient(circle at 70% 25%,#292722 0,#121210 42%,#090908 78%);transition:opacity 1.15s cubic-bezier(.22,1,.36,1),visibility 1.15s}
#veil::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 0 49.8%,rgba(255,255,255,.035) 50%,transparent 50.2%),linear-gradient(180deg,rgba(255,255,255,.025),transparent 24%,rgba(0,0,0,.28));background-size:110px 110px,100% 100%;opacity:.35}
#veil.leave{opacity:0;visibility:hidden;pointer-events:none}
.top{position:absolute;top:0;left:0;right:0;padding:34px 42px;display:flex;justify-content:space-between;align-items:flex-start;z-index:2}.mark{font-size:11px;letter-spacing:.28em;font-weight:700}.edition{font-size:10px;letter-spacing:.22em;color:var(--muted);text-align:right;line-height:1.8}
.hero{position:absolute;left:7vw;bottom:12vh;z-index:2;max-width:980px}.kicker{display:flex;align-items:center;gap:14px;font-size:10px;letter-spacing:.34em;color:var(--accent);margin-bottom:22px}.kicker:before{content:"";width:44px;height:1px;background:var(--accent)}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(54px,8.7vw,142px);line-height:.82;letter-spacing:-.055em;margin:0}.sub{margin:28px 0 0;max-width:520px;color:var(--muted);font-size:13px;line-height:1.8;letter-spacing:.04em}
.loadrow{margin-top:38px;width:min(460px,72vw)}.loadmeta{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.22em;color:var(--muted);margin-bottom:11px}.track{height:1px;background:rgba(255,255,255,.14);overflow:hidden}.bar{height:100%;width:0;background:var(--ink);transition:width .18s linear}
#enter{margin-top:28px;padding:0;border:0;background:none;display:none;align-items:center;gap:18px;cursor:pointer;font-size:11px;letter-spacing:.24em}.circle{width:44px;height:44px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;transition:.35s}.circle:after{content:"↗";font-size:15px}.enterText{border-bottom:1px solid transparent;padding:7px 0;transition:.35s}#enter:hover .circle{background:var(--ink);color:#111;transform:rotate(45deg)}#enter:hover .enterText{border-color:var(--ink)}
.side{position:absolute;right:42px;bottom:42px;writing-mode:vertical-rl;transform:rotate(180deg);font-size:9px;letter-spacing:.25em;color:var(--muted)}
#hud{position:fixed;inset:0;z-index:20;pointer-events:none;opacity:0;transition:opacity .8s}#hud.show{opacity:1}.hudTop{position:absolute;top:0;left:0;right:0;padding:25px 30px;display:flex;justify-content:space-between;align-items:center}.hudBrand{font-size:10px;letter-spacing:.25em;text-shadow:0 1px 10px #000}.hudBtns{display:flex;gap:8px;pointer-events:auto}.hudBtn{border:1px solid rgba(255,255,255,.2);background:rgba(8,8,8,.28);backdrop-filter:blur(14px);padding:10px 13px;font-size:9px;letter-spacing:.18em;cursor:pointer;transition:.25s}.hudBtn:hover{background:rgba(244,241,233,.92);color:#111}
.guide{position:absolute;left:30px;bottom:26px;padding:12px 15px;background:var(--glass);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12);font-size:9px;letter-spacing:.13em;color:rgba(255,255,255,.7);transition:opacity .6s}.guide b{color:#fff;font-weight:500}.guide.fade{opacity:0}
#warning{position:fixed;left:50%;top:25px;transform:translateX(-50%);z-index:60;max-width:min(720px,90vw)}#warning>div{padding:12px 18px;background:rgba(20,20,18,.9);border:1px solid var(--line);font-size:11px;backdrop-filter:blur(14px)}
.corner{position:fixed;z-index:21;width:16px;height:16px;opacity:.45;pointer-events:none}.c1{left:15px;top:15px;border-left:1px solid white;border-top:1px solid white}.c2{right:15px;bottom:15px;border-right:1px solid white;border-bottom:1px solid white}
@media(max-width:700px){.top{padding:24px}.edition{display:none}.hero{left:24px;right:24px;bottom:10vh}.sub{font-size:12px}.side{display:none}.hudTop{padding:18px}.guide{left:18px;bottom:18px;right:18px;text-align:center}.hudBrand{display:none}}
</style>
</head>
<body>
<div id="stage"><div id="unity-container"><canvas id="unity-canvas" tabindex="-1"></canvas></div></div>
<div id="veil">
 <div class="top"><div class="mark">ARCHITECTURE / SPACE</div><div class="edition">DIGITAL EXHIBITION<br>IMMERSIVE WEBGL EXPERIENCE</div></div>
 <main class="hero"><div class="kicker">VIRTUAL GALLERY · 2026</div><h1>Space,<br>Experienced.</h1><p class="sub">건축은 이미지가 아니라 움직이며 경험하는 공간입니다.<br>화면 너머로 들어가 빛, 재료, 비례와 동선을 직접 걸어보세요.</p>
 <div class="loadrow"><div class="loadmeta"><span id="loadLabel">PREPARING THE GALLERY</span><span id="pct">00%</span></div><div class="track"><div class="bar" id="bar"></div></div></div>
 <button id="enter" aria-label="Enter gallery"><span class="circle"></span><span class="enterText">ENTER THE GALLERY</span></button></main>
 <div class="side">SCROLL LESS · EXPERIENCE MORE</div>
</div>
<div id="hud"><div class="hudTop"><div class="hudBrand">IMMERSIVE ARCHITECTURE</div><div class="hudBtns"><button class="hudBtn" id="helpBtn">GUIDE</button><button class="hudBtn" id="fullBtn">FULLSCREEN</button></div></div><div class="guide" id="guide"><b>W A S D</b> MOVE &nbsp;·&nbsp; <b>MOUSE</b> LOOK &nbsp;·&nbsp; <b>ESC</b> CURSOR</div></div>
<div id="warning"></div><div class="corner c1"></div><div class="corner c2"></div>
<script>
const canvas=document.querySelector('#unity-canvas'), veil=document.querySelector('#veil'), enter=document.querySelector('#enter'), hud=document.querySelector('#hud'), guide=document.querySelector('#guide');
function banner(msg,type){const d=document.createElement('div');d.textContent=msg;document.querySelector('#warning').appendChild(d);if(type!=='error')setTimeout(()=>d.remove(),5000)}
const buildUrl='Build'; const loaderUrl=buildUrl+'/build.loader.js';
const config={arguments:[],dataUrl:buildUrl+'/build.data.br',frameworkUrl:buildUrl+'/build.framework.js.br',codeUrl:buildUrl+'/build.wasm.br',streamingAssetsUrl:'StreamingAssets',companyName:'DefaultCompany',productName:'Test12345',productVersion:'0.1.0',showBanner:banner};
let unityInstance=null;const script=document.createElement('script');script.src=loaderUrl;
script.onload=()=>createUnityInstance(canvas,config,p=>{const n=Math.round(p*100);document.querySelector('#bar').style.width=n+'%';document.querySelector('#pct').textContent=String(n).padStart(2,'0')+'%'}).then(u=>{unityInstance=u;document.querySelector('#loadLabel').textContent='GALLERY READY';enter.style.display='flex'}).catch(e=>banner(e,'error'));
document.body.appendChild(script);
enter.onclick=()=>{veil.classList.add('leave');hud.classList.add('show');canvas.focus();setTimeout(()=>guide.classList.add('fade'),6500)};
document.querySelector('#fullBtn').onclick=()=>unityInstance&&unityInstance.SetFullscreen(1);
document.querySelector('#helpBtn').onclick=()=>guide.classList.toggle('fade');
document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='h')hud.classList.toggle('show')});
</script>
</body></html>
